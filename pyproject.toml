[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alasni-contaminate"
version = "0.1.0"
description = "用题目指纹与已知语料比对，标出可能已泄漏的题目"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alasni" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alasni.github.io"
Repository = "https://github.com/alasni/contaminate"
Issues = "https://github.com/alasni/contaminate/issues"

[project.scripts]
contaminate = "contaminate:main"

[tool.setuptools]
py-modules = ["contaminate"]
